; Copiar a /etc/supervisor/conf.d/bloqueria-cola.conf y luego:
;   sudo supervisorctl reread && sudo supervisorctl update
[program:bloqueria-cola]
command=php /var/www/bloqueria/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/bloqueria/storage/logs/cola.log
stopwaitsecs=3600
